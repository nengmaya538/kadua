<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery</title>
    
    <!-- Dynamic Canonical Tag -->
    <link rel="canonical" id="canonicalTag" href="">
    
    <!-- Dynamic Meta Description -->
    <meta name="description" id="metaDescription" content="">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            padding: 8px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #FF9800;
            font-size: clamp(22px, 4.5vw, 32px);
            margin: 16px 0 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(255,152,0,.3);
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: clamp(10px, 2vw, 12px);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .grid-item {
            position: relative;
            aspect-ratio: 16/10;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all .3s ease;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.1);
            -webkit-tap-highlight-color: transparent;
            scroll-margin-top: 20px;
        }
        .grid-item:active { transform: scale(.95) }
        .grid-item:hover {
            border-color: #FF9800;
            box-shadow: 0 8px 25px rgba(0,0,0,.5);
            transform: translateY(-3px);
        }
        
        /* Highlight animation */
        .grid-item.highlight {
            animation: highlightPulse 2s ease;
        }
        @keyframes highlightPulse {
            0%, 100% { border-color: rgba(255,255,255,.1); }
            25%, 75% { border-color: #FF9800; box-shadow: 0 0 30px rgba(255,152,0,.6); }
            50% { border-color: #FF9800; box-shadow: 0 0 50px rgba(255,152,0,.8); }
        }
        
        .video-thumbnail {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Pattern overlay */
        .video-thumbnail::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,.3) 0%, transparent 50%);
            z-index: 1;
        }
        
        /* Grid pattern */
        .video-thumbnail::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 1;
        }
        
        .play-icon {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .3s ease;
            z-index: 2;
            box-shadow: 0 8px 25px rgba(0,0,0,.3);
        }
        .grid-item:hover .play-icon {
            background: rgba(255,255,255,.3);
            border-color: #fff;
            transform: scale(1.15);
            box-shadow: 0 8px 30px rgba(0,0,0,.5);
        }
        .play-icon svg {
            width: 22px;
            height: 22px;
            margin-left: 3px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,.3));
        }
        
        .video-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,.5) 50%, transparent 100%);
            padding: 30px 12px 10px;
            z-index: 2;
        }
        .label {
            display: block;
            text-align: center;
            font-size: clamp(9px, 2vw, 11px);
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            line-height: 1.3;
            transition: color .3s;
            text-shadow: 0 2px 4px rgba(0,0,0,.5);
            text-transform: capitalize;
            margin: 0;
        }
        .grid-item:hover .label { color: #FF9800 }
        
        .duration {
            position: absolute;
            bottom: 8%;
            right: 4%;
            font-size: clamp(8px, 1.5vw, 10px);
            font-weight: 600;
            color: #fff;
            background: rgba(0,0,0,.6);
            padding: 3px 8px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 3;
            letter-spacing: .5px;
            backdrop-filter: blur(5px);
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin: 30px 0 20px;
            flex-wrap: wrap;
        }
        .pagination button {
            background: #111;
            border: 1px solid #222;
            color: #999;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all .3s;
            min-width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pagination button:hover {
            border-color: #FF9800;
            color: #FF9800;
            background: #1a1a1a;
        }
        .pagination button.active {
            background: #FF9800;
            border-color: #FF9800;
            color: #0a0a0a;
            box-shadow: 0 4px 12px rgba(255,152,0,.3);
        }
        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }
        
        .page-indicator {
            text-align: center;
            color: #666;
            font-size: 11px;
            margin-top: -15px;
            margin-bottom: 15px;
            letter-spacing: .5px;
        }
        
        /* Tag Cloud */
        .tag-cloud-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #1a1a1a;
        }
        .tag-cloud-title {
            text-align: center;
            color: #999;
            font-size: clamp(11px, 2.5vw, 13px);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 0 10px;
        }
        .tag-link {
            display: inline-block;
            text-decoration: none;
            color: #999;
            font-size: clamp(10px, 2vw, 12px);
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #222;
            background: #111;
            transition: all .3s ease;
            letter-spacing: .3px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .tag-link:hover {
            border-color: #FF9800;
            color: #FF9800;
            background: #1a1a1a;
            box-shadow: 0 4px 15px rgba(255,152,0,.15);
        }
        .tag-link:active {
            transform: scale(.95);
        }
        
        @media (min-width: 768px) {
            body { padding: 16px }
            h1 { 
                margin: 25px 0 6px; 
                font-size: clamp(28px, 5vw, 38px);
                letter-spacing: 3px;
            }
            .subtitle { margin-bottom: 30px; font-size: 13px; }
            
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
            .grid-item {
                border-radius: 12px;
                aspect-ratio: 16/9;
            }
            .label { font-size: 10px }
            .duration { font-size: 9px; bottom: 7%; right: 3%; }
            
            .play-icon {
                width: 60px;
                height: 60px;
            }
            .play-icon svg {
                width: 26px;
                height: 26px;
            }
            
            .pagination button {
                padding: 10px 14px;
                font-size: 13px;
                min-width: 40px;
                height: 40px;
            }
            .page-indicator { font-size: 12px; }
            
            .tag-cloud-title { font-size: 14px; }
            .tag-link { 
                font-size: 13px; 
                padding: 8px 18px;
            }
        }
        @media (min-width: 1024px) {
            .grid { 
                grid-template-columns: repeat(3, 1fr);
                gap: 15px; 
            }
            .label { font-size: 11px }
            .duration { font-size: 10px; }
            .play-icon {
                width: 65px;
                height: 65px;
            }
            .play-icon svg {
                width: 28px;
                height: 28px;
            }
            .tag-cloud {
                gap: 10px;
                max-width: 900px;
                margin: 0 auto;
            }
        }
    </style>
    
    <script>
        // ============ DYNAMIC CANONICAL TAG ============
        function updateCanonicalTag() {
            var canonicalTag = document.getElementById('canonicalTag');
            var url = new URL(window.location.href);
            var page = url.searchParams.get('page');
            
            if (page && page !== '1') {
                canonicalTag.href = window.location.href;
            } else {
                url.searchParams.delete('page');
                canonicalTag.href = url.toString();
            }
        }
        
        updateCanonicalTag();
        
        window.addEventListener('popstate', function() {
            updateCanonicalTag();
        });
    </script>
    
</head>
<body>
    <h1>Video Gallery</h1>
    <p class="subtitle">Collection of Exclusive Videos</p>
    <div class="container">
        <div class="grid" id="videoGrid"></div>
        <div class="page-indicator" id="pageIndicator"></div>
        <div class="pagination" id="pagination"></div>
        
        <!-- Tag Cloud Section -->
        <div class="tag-cloud-section">
            <h2 class="tag-cloud-title">Explore Tags</h2>
            <div class="tag-cloud" id="tagCloud"></div>
        </div>
    </div>
    
    <script>
        // Dynamic title
        var hostname = window.location.hostname;
        var parts = hostname.split('.');
        var subdomain = parts.length >= 2 ? parts[0].charAt(0).toUpperCase() + parts[0].slice(1) : 'Site';
        var baseTitle = subdomain + ' - Video Gallery';
        
        // Video data
        var videoQueries = [
            'yuyuy_1102',
            'fanyuting2024',
            'tingen_156',
            'cce5677',
            'qqq.qqpp77 leak',
            'dearann211',
            'ztc_713',
            '_01as._',
            'yujun318',
            'jimmmmy_futures',
            'ina__4194',
            'gina99nana',
            'annann12032025',
            'coco_wong_chinyui',
            'ss.lna_',
            '_lizisai',
            'sandyi_1205',
            'yezai7777777',
            'idumbo2305',
            'alithefinali',
            'bianbianbian333',
            'reneeeee.h',
            'viviiiii_cat',
            'melvin_m0719'
        ];
        
        // Fungsi untuk format judul dari query
        function formatTitle(query) {
            var title = query.replace(/_/g, ' ');
            title = title.replace(/\./g, ' ');
            title = title.replace(/\s+/g, ' ').trim();
            title = title.replace(/\b\w/g, function(char) {
                return char.toUpperCase();
            });
            return title;
        }
        
        // Fungsi durasi konsisten berdasarkan index
        function getDuration(index) {
            var totalSeconds = 300 + (index * 137) % 1800; // 5:00 - 35:00
            var minutes = Math.floor(totalSeconds / 60);
            var seconds = totalSeconds % 60;
            return minutes + ':' + String(seconds).padStart(2, '0');
        }
        
        // Color gradients untuk variasi
        var gradients = [
            'linear-gradient(135deg, #FF6B35 0%, #F7931E 50%, #FFB74D 100%)',
            'linear-gradient(135deg, #E91E63 0%, #FF5722 50%, #FF9800 100%)',
            'linear-gradient(135deg, #9C27B0 0%, #E91E63 50%, #FF5722 100%)',
            'linear-gradient(135deg, #3F51B5 0%, #2196F3 50%, #03A9F4 100%)',
            'linear-gradient(135deg, #009688 0%, #4CAF50 50%, #8BC34A 100%)',
            'linear-gradient(135deg, #FF9800 0%, #FFC107 50%, #FFEB3B 100%)',
            'linear-gradient(135deg, #795548 0%, #FF5722 50%, #FF9800 100%)',
            'linear-gradient(135deg, #607D8B 0%, #00BCD4 50%, #009688 100%)',
            'linear-gradient(135deg, #673AB7 0%, #3F51B5 50%, #2196F3 100%)',
            'linear-gradient(135deg, #F44336 0%, #E91E63 50%, #9C27B0 100%)',
            'linear-gradient(135deg, #FF5722 0%, #FF9800 50%, #FFC107 100%)',
            'linear-gradient(135deg, #4CAF50 0%, #8BC34A 50%, #CDDC39 100%)',
            'linear-gradient(135deg, #00BCD4 0%, #03A9F4 50%, #2196F3 100%)',
            'linear-gradient(135deg, #FF6B35 0%, #FF5722 50%, #F44336 100%)',
            'linear-gradient(135deg, #8E44AD 0%, #9B59B6 50%, #E91E63 100%)',
            'linear-gradient(135deg, #16A085 0%, #27AE60 50%, #2ECC71 100%)',
            'linear-gradient(135deg, #D35400 0%, #E67E22 50%, #F39C12 100%)',
            'linear-gradient(135deg, #2980B9 0%, #3498DB 50%, #1ABC9C 100%)',
            'linear-gradient(135deg, #C0392B 0%, #E74C3C 50%, #EC7063 100%)',
            'linear-gradient(135deg, #7F8C8D 0%, #95A5A6 50%, #BDC3C7 100%)',
            'linear-gradient(135deg, #2C3E50 0%, #34495E 50%, #5D6D7E 100%)',
            'linear-gradient(135deg, #E91E63 0%, #FF4081 50%, #FF80AB 100%)',
            'linear-gradient(135deg, #FF9800 0%, #FFB300 50%, #FFC107 100%)',
            'linear-gradient(135deg, #4CAF50 0%, #66BB6A 50%, #81C784 100%)'
        ];
        
        // Pagination config
        var itemsPerPage = 15;
        var totalPages = Math.ceil(videoQueries.length / itemsPerPage);
        
        // Get current page from URL ?page=
        function getCurrentPage() {
            var urlParams = new URLSearchParams(window.location.search);
            var page = parseInt(urlParams.get('page')) || 1;
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            return page;
        }
        
        var currentPage = getCurrentPage();
        
        // Update title dan meta description berdasarkan halaman
        function updateHeadTags(page) {
            // Update title
            if (page > 1) {
                document.title = baseTitle + ' - Page ' + page;
            } else {
                document.title = baseTitle;
            }
            
            // Update meta description
            var start = (page - 1) * itemsPerPage;
            var end = Math.min(start + itemsPerPage, videoQueries.length);
            var pageQueries = videoQueries.slice(start, end);
            
            var descriptions = pageQueries.map(function(query) {
                return formatTitle(query);
            });
            
            var metaDescription = 'Watch: ' + descriptions.join(', ') + '. Video Gallery collection.';
            
            if (metaDescription.length > 155) {
                metaDescription = metaDescription.substring(0, 152) + '...';
            }
            
            document.getElementById('metaDescription').content = metaDescription;
        }
        
        // Update URL without reload
        function updateURL(page) {
            var url = new URL(window.location);
            if (page > 1) {
                url.searchParams.set('page', page);
            } else {
                url.searchParams.delete('page');
            }
            window.history.pushState({}, '', url);
            updateCanonicalTag();
            updateHeadTags(page);
        }
        
        // Fungsi navigasi ke video dari tag
        function goToVideoFromTag(query) {
            var index = videoQueries.indexOf(query);
            if (index === -1) return;
            
            var targetPage = Math.floor(index / itemsPerPage) + 1;
            
            if (targetPage !== currentPage) {
                goToPage(targetPage);
                
                setTimeout(function() {
                    scrollToVideo(index);
                }, 300);
            } else {
                scrollToVideo(index);
            }
        }
        
        // Fungsi scroll ke video dan highlight
        function scrollToVideo(index) {
            var grid = document.getElementById('videoGrid');
            var items = grid.querySelectorAll('.grid-item');
            var itemIndex = index % itemsPerPage;
            
            if (items[itemIndex]) {
                items[itemIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                items[itemIndex].classList.add('highlight');
                setTimeout(function() {
                    items[itemIndex].classList.remove('highlight');
                }, 2000);
            }
        }
        
        // Generate Tag Cloud
        function renderTagCloud() {
            var tagCloud = document.getElementById('tagCloud');
            tagCloud.innerHTML = '';
            
            videoQueries.forEach(function(query, index) {
                var tagLink = document.createElement('a');
                tagLink.href = '#video-' + index;
                tagLink.className = 'tag-link';
                tagLink.textContent = query;
                tagLink.setAttribute('aria-label', 'Tag: ' + query);
                tagLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    goToVideoFromTag(query);
                });
                
                tagCloud.appendChild(tagLink);
            });
        }
        
        // Generate video grid for current page
        function renderVideos(page) {
            var grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            
            var start = (page - 1) * itemsPerPage;
            var end = Math.min(start + itemsPerPage, videoQueries.length);
            
            for (var i = start; i < end; i++) {
                var query = videoQueries[i];
                var videoTitle = formatTitle(query);
                var link = 'https://pict.ngaloco.my.id/categories/?q=' + encodeURIComponent(query);
                var gradient = gradients[i % gradients.length];
                var duration = getDuration(i);
                
                var gridItem = document.createElement('a');
                gridItem.href = link;
                gridItem.className = 'grid-item';
                gridItem.target = '_blank';
                gridItem.id = 'video-' + i;
                gridItem.setAttribute('aria-label', videoTitle);
                gridItem.style.background = gradient;
                
                gridItem.innerHTML = `
                    <div class="video-thumbnail">
                        <div class="play-icon">
                            <svg viewBox="0 0 24 24" fill="white">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                        </div>
                        <div class="video-overlay">
                            <h2 class="label">${videoTitle}</h2>
                        </div>
                        <span class="duration">${duration}</span>
                    </div>
                `;
                
                grid.appendChild(gridItem);
            }
            
            // Update page indicator
            var indicator = document.getElementById('pageIndicator');
            indicator.textContent = 'Page ' + page + ' of ' + totalPages + ' (' + videoQueries.length + ' videos)';
            
            // Update head tags
            updateHeadTags(page);
        }
        
        // Generate pagination
        function renderPagination(currentPage) {
            var pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            if (totalPages <= 1) {
                document.getElementById('pageIndicator').textContent = videoQueries.length + ' videos';
                return;
            }
            
            // Prev button
            var prevBtn = document.createElement('button');
            prevBtn.innerHTML = '‹';
            prevBtn.disabled = currentPage === 1;
            prevBtn.setAttribute('aria-label', 'Previous page');
            prevBtn.addEventListener('click', function() {
                goToPage(currentPage - 1);
            });
            pagination.appendChild(prevBtn);
            
            // Page numbers
            for (var i = 1; i <= totalPages; i++) {
                (function(pageNum) {
                    var pageBtn = document.createElement('button');
                    pageBtn.textContent = pageNum;
                    if (pageNum === currentPage) {
                        pageBtn.classList.add('active');
                    }
                    pageBtn.addEventListener('click', function() {
                        goToPage(pageNum);
                    });
                    pagination.appendChild(pageBtn);
                })(i);
            }
            
            // Next button
            var nextBtn = document.createElement('button');
            nextBtn.innerHTML = '›';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.setAttribute('aria-label', 'Next page');
            nextBtn.addEventListener('click', function() {
                goToPage(currentPage + 1);
            });
            pagination.appendChild(nextBtn);
        }
        
        // Navigate to page
        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            updateURL(page);
            renderVideos(page);
            renderPagination(page);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // Handle browser back/forward
        window.addEventListener('popstate', function() {
            currentPage = getCurrentPage();
            updateCanonicalTag();
            updateHeadTags(currentPage);
            renderVideos(currentPage);
            renderPagination(currentPage);
        });
        
        // Initial render
        renderVideos(currentPage);
        renderPagination(currentPage);
        renderTagCloud();
    </script>
</body>
</html>
