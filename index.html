<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VAST + YouTube Popup</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
}

#vastPopup {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 2147483647;
}

#vastVideo,
#youtubeFrame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

#vastVideo {
    display: block;
    background: #000;
    object-fit: contain;
}

#youtubeFrame {
    display: none;
}

#vastStatus {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 20;

    padding: 7px 10px;

    background: rgba(0,0,0,.65);
    color: #fff;

    font: 13px Arial,sans-serif;
    border-radius: 4px;
}

#closeVastPopup {
    position: absolute;
    top: 15px;
    right: 15px;

    z-index: 50;

    display: none;

    width: 42px;
    height: 42px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.8);
    color: #fff;

    font-size: 28px;
    line-height: 42px;

    padding: 0;
    cursor: pointer;
}

#closeVastPopup:hover {
    background: rgba(0,0,0,1);
}
</style>
</head>

<body>

<div id="vastPopup">

    <video
        id="vastVideo"
        playsinline
        muted
        preload="auto">
    </video>

    <iframe
        id="youtubeFrame"
        src=""
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen>
    </iframe>

    <div id="vastStatus">
        Memuat iklan...
    </div>

    <button
        id="closeVastPopup"
        type="button"
        aria-label="Close">
        ×
    </button>

</div>


<script>
/* =====================================================
   CONFIG
===================================================== */

const VAST_URL =
    "https://vast.vstserv.com/vast?spot_id=2026771";

const YOUTUBE_URL =
    "https://www.youtube.com/embed/ON7KfCvXlMI?autoplay=1&mute=1&rel=0";


/* =====================================================
   ELEMENT
===================================================== */

const popup =
    document.getElementById("vastPopup");

const video =
    document.getElementById("vastVideo");

const youtube =
    document.getElementById("youtubeFrame");

const status =
    document.getElementById("vastStatus");

const closeButton =
    document.getElementById("closeVastPopup");


/* =====================================================
   CLOSE BUTTON
   BENAR-BENAR TERPISAH DARI VAST
===================================================== */

setTimeout(function () {

    if (!popup) return;

    closeButton.style.display = "block";

}, 20000);


/* =====================================================
   CLOSE POPUP
===================================================== */

closeButton.addEventListener("click", function () {

    video.pause();

    video.removeAttribute("src");

    video.load();

    youtube.src = "about:blank";

    popup.remove();

});


/* =====================================================
   XML HELPERS
===================================================== */

function cleanURL(value) {

    if (!value) return null;

    return value
        .trim()
        .replace(/^<!\[CDATA\[/, "")
        .replace(/\]\]>$/, "")
        .trim();
}


function absoluteURL(url, base) {

    try {
        return new URL(url, base).href;
    } catch (e) {
        return url;
    }

}


/* =====================================================
   TRACKING
===================================================== */

function fireTracking(nodes) {

    nodes.forEach(function (node) {

        const url =
            cleanURL(node.textContent);

        if (!url) return;

        /*
         * Image beacon.
         * Tidak mengganggu player.
         */

        const img =
            new Image();

        img.src =
            absoluteURL(
                url,
                VAST_URL
            );

    });

}


/* =====================================================
   FIND MEDIA FILE
===================================================== */

function findMediaFile(xml) {

    const files =
        Array.from(
            xml.querySelectorAll("MediaFile")
        );

    if (!files.length) {
        return null;
    }


    /*
     * Prioritas:
     *
     * 1. MP4
     * 2. video/mp4
     * 3. file lain
     */

    let selected = null;


    for (const file of files) {

        const type =
            (
                file.getAttribute("type") || ""
            ).toLowerCase();

        const url =
            cleanURL(file.textContent);


        if (!url) continue;


        if (
            type === "video/mp4" ||
            type.includes("mp4") ||
            /\.mp4(\?|$)/i.test(url)
        ) {

            selected = url;

            break;

        }

    }


    if (!selected) {

        for (const file of files) {

            const url =
                cleanURL(file.textContent);

            if (url) {

                selected = url;

                break;

            }

        }

    }


    return selected;
}


/* =====================================================
   GET WRAPPER URL
===================================================== */

function findWrapperURL(xml) {

    const node =
        xml.querySelector(
            "VASTAdTagURI"
        );

    if (!node) {
        return null;
    }

    return cleanURL(
        node.textContent
    );
}


/* =====================================================
   LOAD VAST XML
===================================================== */

async function fetchVAST(url) {

    console.log(
        "[VAST] Request:",
        url
    );


    const response =
        await fetch(url, {
            method: "GET",
            mode: "cors",
            cache: "no-store"
        });


    if (!response.ok) {

        throw new Error(
            "VAST HTTP " +
            response.status
        );

    }


    const text =
        await response.text();


    if (!text) {

        throw new Error(
            "VAST response kosong"
        );

    }


    console.log(
        "[VAST] Response diterima:",
        text.substring(0, 500)
    );


    const parser =
        new DOMParser();


    const xml =
        parser.parseFromString(
            text,
            "application/xml"
        );


    /*
     * Cek XML parser error
     */

    if (
        xml.querySelector(
            "parsererror"
        )
    ) {

        throw new Error(
            "XML VAST tidak valid"
        );

    }


    return xml;
}


/* =====================================================
   RESOLVE VAST
   INLINE + WRAPPER
===================================================== */

async function resolveVAST(startURL) {

    let currentURL =
        startURL;

    let lastXML = null;

    /*
     * Maksimal 5 wrapper
     */

    for (
        let attempt = 0;
        attempt < 5;
        attempt++
    ) {

        status.textContent =
            "Memuat iklan...";


        const xml =
            await fetchVAST(
                currentURL
            );


        lastXML = xml;


        /*
         * Cari MediaFile
         */

        const mediaURL =
            findMediaFile(xml);


        if (mediaURL) {

            console.log(
                "[VAST] Media ditemukan:",
                mediaURL
            );


            return {
                xml: xml,
                mediaURL:
                    absoluteURL(
                        mediaURL,
                        currentURL
                    )
            };

        }


        /*
         * Kalau tidak ada MediaFile,
         * coba Wrapper
         */

        const wrapperURL =
            findWrapperURL(xml);


        if (!wrapperURL) {

            throw new Error(
                "Tidak ada MediaFile dan Wrapper"
            );

        }


        currentURL =
            absoluteURL(
                wrapperURL,
                currentURL
            );


        console.log(
            "[VAST] Mengikuti Wrapper:",
            currentURL
        );

    }


    throw new Error(
        "Terlalu banyak VAST Wrapper"
    );
}


/* =====================================================
   SHOW YOUTUBE
===================================================== */

function showYouTube() {

    console.log(
        "[PLAYER] Menampilkan YouTube"
    );


    video.pause();

    video.style.display =
        "none";


    status.style.display =
        "none";


    youtube.src =
        YOUTUBE_URL;


    youtube.style.display =
        "block";
}


/* =====================================================
   START VAST VIDEO
===================================================== */

async function playVAST() {

    try {

        status.textContent =
            "Memuat iklan...";


        const result =
            await resolveVAST(
                VAST_URL
            );


        console.log(
            "[VAST] Final Media:",
            result.mediaURL
        );


        /*
         * Pasang video
         */

        video.src =
            result.mediaURL;

        video.muted =
            true;

        video.playsInline =
            true;


        video.load();


        status.textContent =
            "Iklan sedang diputar...";


        /*
         * Play
         */

        await video.play();


        console.log(
            "[VAST] Playback dimulai"
        );


    } catch (error) {

        console.error(
            "[VAST] ERROR:",
            error
        );


        /*
         * Jangan langsung menyembunyikan
         * popup.
         */

        status.textContent =
            "Iklan tidak tersedia";


        /*
         * Beri waktu sebentar supaya
         * error mudah terlihat saat test.
         */

        setTimeout(function () {

            showYouTube();

        }, 1000);

    }

}


/* =====================================================
   VAST EVENTS
===================================================== */

video.addEventListener(
    "ended",
    function () {

        console.log(
            "[VAST] Iklan selesai"
        );

        showYouTube();

    }
);


video.addEventListener(
    "error",
    function () {

        console.error(
            "[VAST] Video playback error",
            video.error
        );

        showYouTube();

    }
);


/* =====================================================
   START
===================================================== */

playVAST();

</script>

</body>
</html>
