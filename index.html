<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Player</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
}

/* ================================
   FULLSCREEN POPUP
================================ */

#vastPopup {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 2147483647;
}

/* ================================
   VAST VIDEO
================================ */

#vastVideo,
#youtubeFrame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

#vastVideo {
    display: block;
    background: #000;
    object-fit: contain;
}

/* ================================
   YOUTUBE
================================ */

#youtubeFrame {
    display: none;
}

/* ================================
   STATUS
================================ */

#vastStatus {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 20;

    padding: 7px 10px;

    background: rgba(0,0,0,.65);
    color: #fff;

    font: 13px Arial, sans-serif;
    border-radius: 4px;
}

/* ================================
   CLOSE BUTTON
================================ */

#closeVastPopup {
    position: absolute;

    top: 15px;
    right: 15px;

    z-index: 50;

    display: none;

    width: 42px;
    height: 42px;

    border: 0;
    border-radius: 50%;

    background: rgba(0,0,0,.8);
    color: #fff;

    font-size: 28px;
    line-height: 42px;

    padding: 0;

    cursor: pointer;
}

#closeVastPopup:hover {
    background: rgba(0,0,0,1);
}
</style>
</head>

<body>

<!-- =================================
     FULLSCREEN VIDEO POPUP
================================= -->

<div id="vastPopup">

    <!-- VAST VIDEO -->
    <video
        id="vastVideo"
        playsinline
        muted
        preload="auto">
    </video>


    <!-- YOUTUBE VIDEO -->
    <iframe
        id="youtubeFrame"
        src=""
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen>
    </iframe>


    <!-- STATUS -->
    <div id="vastStatus">
        Loading advertisement...
    </div>


    <!-- CLOSE BUTTON -->
    <button
        id="closeVastPopup"
        type="button"
        aria-label="Close">
        ×
    </button>

</div>


<script>
/* =====================================================
   CONFIGURATION
===================================================== */

const VAST_URL =
    "https://vast.vstserv.com/vast?spot_id=2026771";

const YOUTUBE_URL =
    "https://www.youtube.com/embed/ON7KfCvXlMI?autoplay=1&mute=1&rel=0";


/* =====================================================
   ELEMENTS
===================================================== */

const popup =
    document.getElementById("vastPopup");

const video =
    document.getElementById("vastVideo");

const youtube =
    document.getElementById("youtubeFrame");

const status =
    document.getElementById("vastStatus");

const closeButton =
    document.getElementById("closeVastPopup");


/* =====================================================
   CLOSE BUTTON TIMER
   The close button appears after 20 seconds.
   This timer is completely independent
   from the VAST advertisement.
===================================================== */

setTimeout(function () {

    if (!popup) return;

    closeButton.style.display = "block";

}, 20000);


/* =====================================================
   CLOSE POPUP
===================================================== */

closeButton.addEventListener("click", function () {

    /* Stop VAST video */

    video.pause();

    video.removeAttribute("src");

    video.load();


    /* Stop YouTube */

    youtube.src = "about:blank";


    /* Remove popup */

    popup.remove();

});


/* =====================================================
   CLEAN URL
===================================================== */

function cleanURL(value) {

    if (!value) return null;

    return value
        .trim()
        .replace(/^<!\[CDATA\[/, "")
        .replace(/\]\]>$/, "")
        .trim();
}


/* =====================================================
   ABSOLUTE URL
===================================================== */

function absoluteURL(url, base) {

    try {

        return new URL(url, base).href;

    } catch (e) {

        return url;

    }

}


/* =====================================================
   FIND MEDIA FILE
===================================================== */

function findMediaFile(xml) {

    const files =
        Array.from(
            xml.querySelectorAll("MediaFile")
        );


    if (!files.length) {
        return null;
    }


    /*
     * Prefer MP4.
     */

    for (const file of files) {

        const type =
            (
                file.getAttribute("type") || ""
            ).toLowerCase();

        const url =
            cleanURL(file.textContent);


        if (!url) continue;


        if (
            type === "video/mp4" ||
            type.includes("mp4") ||
            /\.mp4(\?|$)/i.test(url)
        ) {

            return url;

        }

    }


    /*
     * Fallback to first available MediaFile.
     */

    for (const file of files) {

        const url =
            cleanURL(file.textContent);

        if (url) {
            return url;
        }

    }


    return null;
}


/* =====================================================
   FIND VAST WRAPPER
===================================================== */

function findWrapperURL(xml) {

    const node =
        xml.querySelector(
            "VASTAdTagURI"
        );


    if (!node) {
        return null;
    }


    return cleanURL(
        node.textContent
    );
}


/* =====================================================
   FETCH VAST
===================================================== */

async function fetchVAST(url) {

    console.log(
        "[VAST] Request:",
        url
    );


    const response =
        await fetch(url, {
            method: "GET",
            mode: "cors",
            cache: "no-store"
        });


    if (!response.ok) {

        throw new Error(
            "VAST HTTP " +
            response.status
        );

    }


    const text =
        await response.text();


    if (!text) {

        throw new Error(
            "Empty VAST response"
        );

    }


    console.log(
        "[VAST] Response received:",
        text.substring(0, 500)
    );


    const parser =
        new DOMParser();


    const xml =
        parser.parseFromString(
            text,
            "application/xml"
        );


    /*
     * Check XML parser error.
     */

    if (
        xml.querySelector(
            "parsererror"
        )
    ) {

        throw new Error(
            "Invalid VAST XML"
        );

    }


    return xml;
}


/* =====================================================
   RESOLVE VAST
   Supports Inline + Wrapper
===================================================== */

async function resolveVAST(startURL) {

    let currentURL =
        startURL;


    /*
     * Maximum 5 wrapper levels.
     */

    for (
        let attempt = 0;
        attempt < 5;
        attempt++
    ) {

        status.textContent =
            "Loading advertisement...";


        const xml =
            await fetchVAST(
                currentURL
            );


        /*
         * Try to find MediaFile.
         */

        const mediaURL =
            findMediaFile(xml);


        if (mediaURL) {

            console.log(
                "[VAST] Media found:",
                mediaURL
            );


            return {

                xml: xml,

                mediaURL:
                    absoluteURL(
                        mediaURL,
                        currentURL
                    )

            };

        }


        /*
         * No MediaFile.
         * Try VAST Wrapper.
         */

        const wrapperURL =
            findWrapperURL(xml);


        if (!wrapperURL) {

            throw new Error(
                "No MediaFile or VAST Wrapper found"
            );

        }


        currentURL =
            absoluteURL(
                wrapperURL,
                currentURL
            );


        console.log(
            "[VAST] Following Wrapper:",
            currentURL
        );

    }


    throw new Error(
        "Too many VAST Wrapper levels"
    );
}


/* =====================================================
   SHOW YOUTUBE
===================================================== */

function showYouTube() {

    console.log(
        "[PLAYER] Showing YouTube"
    );


    /* Stop VAST */

    video.pause();


    video.style.display =
        "none";


    /* Hide status */

    status.style.display =
        "none";


    /* Load YouTube */

    youtube.src =
        YOUTUBE_URL;


    youtube.style.display =
        "block";
}


/* =====================================================
   PLAY VAST
===================================================== */

async function playVAST() {

    try {

        status.textContent =
            "Loading advertisement...";


        /*
         * Resolve VAST Inline / Wrapper.
         */

        const result =
            await resolveVAST(
                VAST_URL
            );


        console.log(
            "[VAST] Final media:",
            result.mediaURL
        );


        /*
         * Load advertisement.
         */

        video.src =
            result.mediaURL;

        video.muted =
            true;

        video.playsInline =
            true;


        video.load();


        status.textContent =
            "Advertisement playing...";


        /*
         * Start playback.
         */

        await video.play();


        console.log(
            "[VAST] Playback started"
        );


    } catch (error) {

        /*
         * Technical errors are kept
         * in the browser console.
         */

        console.error(
            "[VAST] ERROR:",
            error
        );


        /*
         * User-facing message.
         */

        status.textContent =
            "Advertisement unavailable";


        /*
         * Continue to YouTube
         * after a short delay.
         */

        setTimeout(function () {

            showYouTube();

        }, 1000);

    }

}


/* =====================================================
   VAST FINISHED
===================================================== */

video.addEventListener(
    "ended",
    function () {

        console.log(
            "[VAST] Advertisement finished"
        );


        showYouTube();

    }
);


/* =====================================================
   VAST PLAYBACK ERROR
===================================================== */

video.addEventListener(
    "error",
    function () {

        console.error(
            "[VAST] Video playback error:",
            video.error
        );


        showYouTube();

    }
);


/* =====================================================
   START
===================================================== */

playVAST();

</script>

</body>
</html>
